[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefvision-edge"
version = "0.1.0"
description = "Offline-first field inference for ReefVision"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
runtime-cpu = [
  "onnxruntime==1.32.0",
]
runtime-windows-cuda = [
  "onnxruntime-gpu==1.32.0",
  "nvidia-cublas==13.4.1.3",
  "nvidia-cuda-nvrtc==13.4.92",
  "nvidia-cuda-runtime==13.4.92",
  "nvidia-cudnn-cu13==9.28.1.4",
  "nvidia-cufft==12.4.0.43",
  "nvidia-curand==10.4.4.72",
  "nvidia-nvjitlink==13.4.92",
]
# Jetson uses the ONNX Runtime/TensorRT build supplied for its JetPack release.
# Keeping it empty prevents Windows CUDA wheels from leaking into ARM64 bundles.
runtime-jetson = []
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "onnx>=1.17,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
windows-package = [
  "pyinstaller==6.16.0",
]

[project.urls]
Repository = "https://github.com/Rafael-Del-Valle/ReefVision-Edge"

[project.scripts]
reefvision-edge = "reefvision_edge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reefvision_edge = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reefvision_edge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "onnxruntime"]
ignore_missing_imports = true
